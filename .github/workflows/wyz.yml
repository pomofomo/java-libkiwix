# wyz fork only: build, test and publish io.github.pomofomo:libkiwix-wyz(-jvm)
# to this fork's GitHub Packages.
# Publishing runs on tags named "v<VERSION>", e.g. v2.7.0-wyz.1 (must match
# VERSION in lib/build.gradle).
name: wyz

on:
  push:
    branches:
      - wyz
    tags:
      - 'v*-wyz.*'
  workflow_dispatch:

jobs:
  build:
    name: Build, test and publish
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: adopt
          java-version: 17

      - name: Install dependencies
        run: bash ./install_deps.sh

      - name: Compile Project
        run: ./gradlew buildHeaders build

      - name: Run tests
        run: ./gradlew runTests

      - name: Test the desktop JVM jar
        run: ./gradlew testJvmJar

      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION=$(sed -n 's/.*set("VERSION", "\(.*\)").*/\1/p' lib/build.gradle)
          if [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match VERSION ${VERSION}"
            exit 1
          fi

      - name: Publish to GitHub Packages
        if: startsWith(github.ref, 'refs/tags/')
        run: ./gradlew publishAllPublicationsToGitHubPackagesRepository --max-workers 1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload the jars
        uses: actions/upload-artifact@v4
        with:
          name: libkiwix-wyz
          path: |
            build/wyz-jvm/libs/*.jar
            lib/build/outputs/aar/lib-release.aar
